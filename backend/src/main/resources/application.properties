spring.application.name=awesome-project
spring.mvc.servlet.path=${API_PATH}

# Main Database

spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Redis Database

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# Common Config

logging.pattern.level=%5p [req:%X{requestId:-}]
management.endpoints.web.exposure.include=health,info
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# SSAFY API
auth.api.key=***REMOVED***

# JWT Config

auth.jwt.secret=${AUTH_JWT_SECRET}
auth.jwt.issuer=${AUTH_JWT_ISSUER}
auth.jwt.access-token-ttl-seconds=${AUTH_ACCESS_TOKEN_TTL_SECONDS}
auth.jwt.refresh-token-ttl-seconds=${AUTH_REFRESH_TOKEN_TTL_SECONDS}


