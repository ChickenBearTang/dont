services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
    command:
      ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-net

  ai-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
      POSTGRES_DB: ${AI_POSTGRES_DB:-ai_crawl}
      POSTGRES_USER: ${AI_POSTGRES_USER:-ai_user}
      POSTGRES_PASSWORD: ${AI_POSTGRES_PASSWORD:-ai_password}
    # 컨테이너끼리는 서비스 이름(ai-postgres:5432)으로 붙는다. 호스트에는 로컬에서만 연다 (원격에서 붙으려면 SSH 터널).
    # 기본 비밀번호(ai_password)로 바깥에 열려 있으면 가격 학습·가용성 판정에 쓰는 수집 데이터를 누구나 고칠 수 있다.
    ports:
      - "127.0.0.1:${AI_POSTGRES_PORT:-55432}:5432"
    volumes:
      - ai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${AI_POSTGRES_USER:-ai_user} -d ${AI_POSTGRES_DB:-ai_crawl}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-net

  ai-python:
    build:
      context: ./backend/AI_TMP/ai
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      AI_POSTGRES_DSN: postgresql://${AI_POSTGRES_USER:-ai_user}:${AI_POSTGRES_PASSWORD:-ai_password}@ai-postgres:5432/${AI_POSTGRES_DB:-ai_crawl}
      AI_POSTGRES_HOST: ai-postgres
      AI_POSTGRES_PORT: 5432
      AI_POSTGRES_DB: ${AI_POSTGRES_DB:-ai_crawl}
      AI_POSTGRES_USER: ${AI_POSTGRES_USER:-ai_user}
      AI_POSTGRES_PASSWORD: ${AI_POSTGRES_PASSWORD:-ai_password}
      # 사용자 반응·감사 로그·입력 스냅샷은 컨테이너를 다시 만들어도 남아야 한다. 이미지 안의 모델 파일(data/artifacts)을
      # 가리지 않도록 data 전체가 아니라 이 디렉터리만 볼륨으로 둔다.
      AI_RUNTIME_DIR: /var/lib/dont-ai
      PYTHONUNBUFFERED: "1"
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "18000"]
    depends_on:
      ai-postgres:
        condition: service_healthy
    # 인증이 없는 내부 서비스다. 호스트에 게시하지 않고 app-net 안(backend)에서만 부른다.
    expose:
      - "18000"
    volumes:
      - ai-runtime-data:/var/lib/dont-ai
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
        TZ: Asia/Seoul
        REDIS_HOST: redis
        REDIS_PORT: 6379
        AI_SERVER_URL: http://ai-python:18000
        AI_SERVER_CONNECT_TIMEOUT_MS: "3000"
        AI_SERVER_READ_TIMEOUT_MS: "60000"
        AI_POSTGRES_HOST: ai-postgres
        AI_POSTGRES_PORT: 5432
        AI_POSTGRES_DB: ${AI_POSTGRES_DB:-ai_crawl}
        AI_POSTGRES_USER: ${AI_POSTGRES_USER:-ai_user}
        AI_POSTGRES_PASSWORD: ${AI_POSTGRES_PASSWORD:-ai_password}
        API_PATH: "/api/v1"
        DB_HIKARI_CONNECTION_TIMEOUT: "30000"
    depends_on:
      redis:
        condition: service_healthy
      ai-postgres:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - app-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - app-net

  edge-nginx:
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile
    image: jenkincicd-edge-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${SSL_CERT_PATH:-/dev/null}:/etc/nginx/certs/fullchain.pem:ro
      - ${SSL_KEY_PATH:-/dev/null}:/etc/nginx/certs/privkey.pem:ro
    command: ["sh", "/entrypoint-nginx.sh"]
    environment:
      TZ: Asia/Seoul
      SSL_ENABLED: ${SSL_ENABLED:-false}
    networks:
      - app-net

  loki:
    image: grafana/loki:2.9.10
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./infra/observability/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    expose:
      - "3100"
    networks:
      - app-net

  alloy:
    image: grafana/alloy:v1.9.2
    restart: unless-stopped
    command: ["run", "/etc/alloy/config.alloy"]
    volumes:
      - ./infra/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - app-net

  grafana:
    image: grafana/grafana:11.2.2
    restart: unless-stopped
    depends_on:
      - loki
    environment:
      # 새로 만드는 grafana-data 볼륨에만 적용된다. 이미 만들어진 볼륨의 비밀번호는 바뀌지 않으니
      # `docker compose exec grafana grafana cli admin reset-admin-password '<새 비밀번호>'` 로 바꾼다.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?.env 에 GRAFANA_ADMIN_PASSWORD (Grafana 관리자 비밀번호) 를 넣어 주세요}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    # 로그에는 요청·오류 내용이 들어 있다. 호스트 밖으로는 열지 않는다 (SSH 터널로 접속).
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - app-net

  jenkins:
    build:
      context: ./infra/jenkins
      dockerfile: Dockerfile
    image: s14p21a605/jenkins:lts-jdk21-docker
    restart: unless-stopped
    profiles: ["ci"]
    user: root
    # docker.sock 을 쓰는 root 컨테이너라 뚫리면 호스트가 넘어간다. 웹 UI 는 기본이 로컬 전용이다.
    # GitLab/GitHub 웹훅으로 빌드를 시작하려면 .env 에 JENKINS_BIND=0.0.0.0 을 두고 방화벽/보안그룹으로 출처를 제한한다.
    # 50000 은 원격 에이전트용인데 이 파이프라인은 컨트롤러에서 직접 돌아서(agent any) 로컬 전용이다.
    ports:
      - "${JENKINS_BIND:-127.0.0.1}:8081:8080"
      - "127.0.0.1:50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app-net


networks:
  app-net:
    driver: bridge

volumes:
  redis-data:
  ai-postgres-data:
  ai-runtime-data:
  jenkins_home:
  loki-data:
  grafana-data:
